<svg xmlns="http://www.w3.org/2000/svg" width="980" height="480" viewBox="0 0 980 480" role="img" aria-labelledby="title desc">
  <title id="title">历史 BEV 旋转的视觉效果与逆采样</title>
  <desc id="desc">正 yaw 在数组画面中表现为顺时针；rotate 正角度视觉逆时针，但输出格从物理正角度的源位置取值。</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#1e4e79"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#d9534f"/></marker>
    <style>text{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#172b4d}.title{font-size:26px;font-weight:700}.head{font-size:21px;font-weight:700}.small{font-size:16px}.formula{font-family:serif;font-size:19px}.axis{stroke:#1e4e79;stroke-width:3}.arc{fill:none;stroke:#d9534f;stroke-width:3}</style>
  </defs>
  <rect width="980" height="480" fill="#fbfdff"/>
  <text x="490" y="36" text-anchor="middle" class="title">为什么 rotate(+Δψ) 看起来反向，却能从正确的历史位置取样</text>
  <text x="230" y="77" text-anchor="middle" class="head">物理 LiDAR 平面（右手系）</text>
  <line x1="230" y1="245" x2="390" y2="245" class="axis" marker-end="url(#a)"/><text x="397" y="251" class="small">+x：前方</text>
  <line x1="230" y1="245" x2="230" y2="105" class="axis" marker-end="url(#a)"/><text x="240" y="116" class="small">+y：左方</text>
  <path d="M330 245 A100 100 0 0 0 280 158" class="arc" marker-end="url(#r)"/>
  <text x="296" y="205" class="small" fill="#d9534f">物理 +Δψ</text>
  <circle cx="230" cy="245" r="5" fill="#172b4d"/>
  <text x="230" y="325" text-anchor="middle" class="formula">xₜ₋₁ = R_phys(+Δψ) xₜ</text>
  <text x="230" y="354" text-anchor="middle" class="small">当前正前方 → 历史图的前左方</text>
  <line x1="490" y1="72" x2="490" y2="420" stroke="#b9c9da" stroke-width="2"/>
  <text x="735" y="77" text-anchor="middle" class="head">BEV 数组画面与 torchvision.rotate</text>
  <rect x="595" y="125" width="280" height="230" fill="#edf6ff" stroke="#1e4e79" stroke-width="3"/>
  <line x1="735" y1="240" x2="850" y2="240" class="axis" marker-end="url(#a)"/><text x="790" y="228" class="small">w / +x</text>
  <line x1="735" y1="240" x2="735" y2="332" class="axis" marker-end="url(#a)"/><text x="744" y="310" class="small">h / +y</text>
  <circle cx="735" cy="240" r="5" fill="#172b4d"/>
  <circle cx="825" cy="240" r="7" fill="#2b78c5"/><text x="823" y="219" text-anchor="middle" class="small">当前输出格</text>
  <circle cx="813" cy="285" r="7" fill="#d9534f"/><text x="822" y="309" class="small">历史源格</text>
  <path d="M825 240 A90 90 0 0 1 813 285" class="arc" marker-end="url(#r)"/>
  <text x="692" y="387" class="small">物理 +Δψ 在数组位置中是顺时针</text>
  <text x="735" y="415" text-anchor="middle" class="formula">rotate(F,+Δψ)(q) = F(R_vis(−Δψ)q)</text>
  <text x="735" y="445" text-anchor="middle" class="small">图像内容视觉逆时针；输出位置却逆向读取右下方历史源位置。</text>
</svg>
